name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs, not tags: a tag is mutable, so
      # `@v4` lets the action's owner (or anyone who compromises that
      # account) change what runs inside a job that holds `contents: write`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify version matches tag
        # The tag reaches the script through the environment rather than by
        # `${{ }}` interpolation into the shell body. The `on.push.tags` filter
        # makes injection impossible today, but interpolation would turn any
        # future loosening of that filter into shell execution.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          if [ "$MANIFEST_VERSION" != "$TAG_NAME" ]; then
            echo "manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_NAME)"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
