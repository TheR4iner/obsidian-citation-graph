name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs, not tags: a tag is mutable, so
      # `@v7` lets the action's owner (or anyone who compromises that
      # account) change what runs inside a job that holds `contents: write`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify version matches tag
        # The tag reaches the script through the environment rather than by
        # `${{ }}` interpolation into the shell body. The `on.push.tags` filter
        # makes injection impossible today, but interpolation would turn any
        # future loosening of that filter into shell execution.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          if [ "$MANIFEST_VERSION" != "$TAG_NAME" ]; then
            echo "manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_NAME)"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
